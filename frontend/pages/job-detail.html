<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Lowongan - LearnHire</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <a href="jobs.html" class="btn btn-outline mb-4"><i class="fas fa-arrow-left"></i> Kembali</a>
            
            <div id="job-detail-container">
                <!-- Loaded via JS -->
            </div>
        </main>
    </div>

    <!-- Application Modal -->
    <div id="apply-modal" class="modal">
        <div class="modal-content card">
            <h3 class="mb-3">Kirim Lamaran</h3>
            <form id="apply-form">
                <div class="form-group">
                    <label class="form-label">Surat Lamaran (Cover Letter)</label>
                    <textarea id="cover-letter" class="form-control" rows="5" required placeholder="Tuliskan mengapa Anda cocok untuk posisi ini..."></textarea>
                </div>
                <div class="d-flex gap-2 justify-end">
                    <button type="button" class="btn btn-outline" id="btn-close-modal">Batal</button>
                    <button type="submit" class="btn btn-primary" id="btn-submit-apply">Kirim Lamaran</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/pages/job-detail.js"></script>
</body>
</html>
